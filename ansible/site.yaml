# Configuración del escenario, se ejecuta con "ansible-playbook site.yaml"

# Preparación de todas las máquinas (también el balanceador): esperar a que
# arranquen, actualizar e instalar las herramientas de administración
- name: Configuración común
  hosts: all
  become: true
  # Los facts se recogen dentro del rol commons, cuando la máquina ya responde
  gather_facts: false
  roles:
    - commons

# La base de datos va antes que la web: la aplicación la necesita
- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidores web
  hosts: servidores_web
  become: true
  roles:
    - web

# El balanceador, al final: reparte entre servidores web ya configurados
- name: Balanceador de carga
  hosts: balanceadores
  become: true
  roles:
    - balanceador
