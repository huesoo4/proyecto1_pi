# Configuración del escenario, se ejecuta con "ansible-playbook site.yaml"

- name: Configuración común del balanceador
  hosts: balanceadores
  become: true
  # Los facts se recogen dentro del rol commons, cuando la máquina ya responde
  gather_facts: false
  roles:
    - commons

# El balanceador hace de router, da salida a internet a la red de datos. Tiene
# que estar listo antes de preparar los servidores, que solo salen por él
- name: Router
  hosts: balanceadores
  become: true
  roles:
    - router

# Comunes en servidores, cuando ya tienen salida a internet por el balanceador
- name: Configuración común de los servidores
  hosts: servidores
  become: true
  gather_facts: false
  roles:
    - commons

# La base de datos va antes que la web: la aplicación la necesita
- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidores web
  hosts: servidores_web
  become: true
  roles:
    - web

# El balanceador, al final: reparte entre servidores web ya configurados
- name: Balanceador de carga
  hosts: balanceadores
  become: true
  roles:
    - balanceador
