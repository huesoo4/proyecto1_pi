# Opciones de MariaDB que pide Nextcloud
bd_opciones:
  transaction_isolation: READ-COMMITTED
  binlog_format: ROW

# Cortafuegos (rol cortafuegos), además de lo común a todos los servidores:
# MariaDB y NFS solo aceptan conexiones de los servidores de Nextcloud
cortafuegos_entrada:
  - puerto: 3306
    origenes: "{{ bd_clientes }}"
  - puerto: 2049
    origenes: "{{ ips_datos_nextcloud }}"
cortafuegos_salida: []
