# Nextcloud (fijado a una versión, con su suma SHA-256, para que el despliegue no cambie)
nextcloud_version: 35.0.3
nextcloud_sha256: 58401440ce81b7f8d445a8c2a8027572b616ef83592f96b121fd15ec8a1aed35
nextcloud_url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.tar.bz2"
nextcloud_raiz: /var/www/nextcloud
# Ficheros de los usuarios (directorio compartido por NFS, mismo punto de
# montaje en los dos servidores)
nextcloud_datos: /mnt/nextcloud

# Límites de PHP
nextcloud_php_memoria: 512M
nextcloud_php_subida: 512M

# Cortafuegos (rol cortafuegos), además de lo común a todos los servidores:
# HTTP solo desde el balanceador y conexión a MariaDB y NFS en el servidor de datos
cortafuegos_entrada:
  - puerto: 80
    origenes: ["{{ ip_datos_balanceador }}"]
cortafuegos_salida:
  - puerto: 3306
    destinos: ["{{ ip_datos_bd }}"]
  - puerto: 2049
    destinos: ["{{ ip_datos_bd }}"]
