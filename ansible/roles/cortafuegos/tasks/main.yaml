# ufw (viene en Ubuntu) es incompatible con iptables-persistent
- name: Desinstalar ufw
  ansible.builtin.apt:
    name: ufw
    state: absent

# iptables-persistent carga /etc/iptables/rules.v4 y rules.v6 en cada arranque
- name: Instalar iptables
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
    state: present
