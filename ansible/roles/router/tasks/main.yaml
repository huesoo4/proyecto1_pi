# El balanceador acturará como router
- name: Activar el reenvío de paquetes
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/90-router.conf
    state: present
    reload: true

# iptables-persistent carga /etc/iptables/rules.v4 en cada arranque
- name: Instalar iptables
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
    state: present

# validate: si las reglas tienen errores no se sustituyen las que funcionan
- name: Configurar las reglas de NAT y reenvío
  ansible.builtin.template:
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: "0640"
    validate: iptables-restore --test %s
  notify: Cargar las reglas de iptables
