- name: Instalar MariaDB y la librería de Python para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: MariaDB escucha solo en la red de datos
  ansible.builtin.template:
    src: 99-red-datos.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-red-datos.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar mariadb

# Se reinicia ya, antes de crear la base de datos y el usuario
- name: Aplicar los cambios de configuración pendientes
  ansible.builtin.meta: flush_handlers

- name: Asegurar que MariaDB está en marcha
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear la base de datos de la aplicación
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

# Un usuario 'usuario'@'IP' por cada servidor cliente: solo pueden conectarse
# ellos, y solo por la red de datos
- name: Crear el usuario, que solo puede conectarse desde los servidores clientes
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ item }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_unix_socket: "{{ mariadb_socket }}"
  loop: "{{ bd_clientes }}"

# Solo si la aplicación trae un script con sus tablas. Nextcloud no lo necesita:
# las crea su instalador
- name: Crear las tablas de la aplicación
  ansible.builtin.include_tasks: esquema.yaml
  when: schema_url is defined
