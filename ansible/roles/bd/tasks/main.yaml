- name: Instalar MariaDB y la librería de Python para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: MariaDB escucha solo en la red de datos
  ansible.builtin.template:
    src: 99-red-datos.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-red-datos.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar mariadb

# Se reinicia ya, antes de crear la base de datos y el usuario
- name: Aplicar los cambios de configuración pendientes
  ansible.builtin.meta: flush_handlers

- name: Asegurar que MariaDB está en marcha
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear la base de datos de la aplicación
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el usuario, que solo puede conectarse desde el servidor web
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ ip_datos_web }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el directorio para el script de la base de datos
  ansible.builtin.file:
    path: "{{ schema_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Descargar el script que crea las tablas
  ansible.builtin.get_url:
    url: "{{ schema_url }}"
    dest: "{{ schema_dest }}"
    mode: "0644"

# schema.sql no es idempotente (CREATE TABLE sin IF NOT EXISTS): solo se
# importa si la tabla todavía no existe
- name: Comprobar si las tablas ya están creadas
  community.mysql.mysql_query:
    login_db: "{{ bd_nombre }}"
    query: "SHOW TABLES LIKE 'messages'"
    login_unix_socket: "{{ mariadb_socket }}"
  register: tablas
  changed_when: false

- name: Crear las tablas de la aplicación
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: import
    target: "{{ schema_dest }}"
    login_unix_socket: "{{ mariadb_socket }}"
  when: tablas.query_result[0] | length == 0
