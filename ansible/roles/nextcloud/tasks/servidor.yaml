# bzip2 para extraer Nextcloud, nfs-common para montar los ficheros y el cliente
# de MariaDB para comprobar la conexión con la base de datos
- name: Instalar Apache con PHP
  ansible.builtin.apt:
    name:
      - apache2
      - libapache2-mod-php
      - php-mysql
      - php-mbstring
      - php-curl
      - php-gd
      - php-xml
      - php-zip
      - php-intl
      - php-bcmath
      - php-gmp
      - php-imagick
      - bzip2
      - nfs-common
      - mariadb-client
    state: present

- name: Activar los módulos de Apache que usa el .htaccess de Nextcloud
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - headers
    - env
    - dir
    - mime
  notify: Reiniciar apache2

- name: Montar los ficheros compartidos
  ansible.posix.mount:
    src: "{{ ip_datos_bd }}:{{ nfs_directorio }}"
    path: "{{ nextcloud_datos }}"
    fstype: nfs4
    opts: rw,_netdev
    state: mounted

- name: Descargar Nextcloud
  ansible.builtin.get_url:
    url: "{{ nextcloud_url }}"
    dest: "/usr/local/src/nextcloud-{{ nextcloud_version }}.tar.bz2"
    checksum: "sha256:{{ nextcloud_sha256 }}"
    mode: "0644"

# creates: si ya está extraído no se toca
- name: Extraer Nextcloud
  ansible.builtin.unarchive:
    src: "/usr/local/src/nextcloud-{{ nextcloud_version }}.tar.bz2"
    dest: "{{ nextcloud_raiz | dirname }}"
    remote_src: true
    owner: www-data
    group: www-data
    creates: "{{ nextcloud_raiz }}/version.php"
