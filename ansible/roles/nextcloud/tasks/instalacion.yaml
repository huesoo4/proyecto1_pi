# Se instala una sola vez, en el primer servidor: crea las tablas y config.php.
# no_log: la orden lleva las contraseñas
- name: Ejecutar el instalador en el primer servidor
  ansible.builtin.command:
    argv:
      - php
      - occ
      - maintenance:install
      - --database=mysql
      - "--database-host={{ ip_datos_bd }}"
      - "--database-name={{ bd_nombre }}"
      - "--database-user={{ bd_usuario }}"
      - "--database-pass={{ bd_password }}"
      - "--admin-user={{ nextcloud_admin_usuario }}"
      - "--admin-pass={{ nextcloud_admin_password }}"
      - "--data-dir={{ nextcloud_datos }}"
    chdir: "{{ nextcloud_raiz }}"
    creates: "{{ nextcloud_raiz }}/config/config.php"
  become_user: www-data
  no_log: true
  when: inventory_hostname == groups['servidores_nextcloud'][0]

# Los dos servidores son la misma instancia: config.php lleva el identificador,
# las claves y la conexión a la base de datos, y tiene que ser igual en todos
- name: Leer config.php del primer servidor
  ansible.builtin.slurp:
    src: "{{ nextcloud_raiz }}/config/config.php"
  register: nextcloud_config
  run_once: true
  delegate_to: "{{ groups['servidores_nextcloud'][0] }}"
  no_log: true

- name: Copiar config.php a los demás servidores
  ansible.builtin.copy:
    content: "{{ nextcloud_config.content | b64decode }}"
    dest: "{{ nextcloud_raiz }}/config/config.php"
    owner: www-data
    group: www-data
    mode: "0640"
  no_log: true
  when: inventory_hostname != groups['servidores_nextcloud'][0]
