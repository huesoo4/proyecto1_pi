[defaults]
# Inventario generado por OpenTofu (opentofu/inventario.tf)
inventory = hosts
# Las máquinas se recrean con cada "tofu apply": sus claves de host cambian
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
pipelining = True
